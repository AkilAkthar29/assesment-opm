services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: local-dev
      POSTGRES_DB: catalog
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    build: .
    environment:
      DATABASE_URL: postgresql://catalog:local-dev@db:5432/catalog
      DATA_DIR: /data
      ALLOW_TEST_DATABASE_RESET: "1"
    depends_on:
      db:
        condition: service_healthy
    command: python -m unittest discover -s tests -v
