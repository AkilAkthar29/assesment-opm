x-backend: &backend
  build: .
  environment:
    DATABASE_URL: postgresql://catalog:local-dev@db:5432/catalog
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
    ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
    SECRET_KEY: ${SECRET_KEY:-local-development-only}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
    PUBLIC_DEPLOYMENT: ${PUBLIC_DEPLOYMENT:-0}
  volumes:
    - uploads:/data
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: local-dev
      POSTGRES_DB: catalog
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
  api:
    <<: *backend
    command: sh -c "python -c 'from catalog.db import initialize; initialize()' && gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 180"
  catalog-worker:
    <<: *backend
    command: celery -A config.celery worker -Q catalog -c 1 -n catalog@%h
  webhook-worker:
    <<: *backend
    command: celery -A config.celery worker -Q webhooks -c 1 -n webhooks@%h
  scheduler:
    <<: *backend
    command: celery -A config.celery beat --schedule /tmp/product-ops-beat
  frontend:
    build: frontend
    depends_on: [api]
  gateway:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${BIND_IP:-127.0.0.1}:3000:3000"
    depends_on: [api, frontend]
volumes:
  uploads:
  postgres:

